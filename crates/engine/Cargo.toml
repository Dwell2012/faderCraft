[package]
name = "djcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18.2"
djcraft-protocol = { version = "0.1.0", path = "../protocol" }
rtrb = "0.4.0"
rubato = "5.0.1"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.6.1", features = ["all"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", features = ["asio"] }
wasapi = "0.25.0"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Media_Audio"] }
