[package]
name = "djcraft-controllers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native = ["dep:midir"]

[dependencies]
djcraft-protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
midir = { version = "0.11", optional = true }

[dev-dependencies]
djcraft-engine = { version = "0.1.0", path = "../engine" }

[[example]]
name = "monitor"
required-features = ["native"]
