name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and main ancestry
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Locate Windows SDK resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $resourceCompiler = Get-ChildItem -LiteralPath $sdkBin -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\rc.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $resourceCompiler) { throw 'Windows SDK x64 resource compiler was not found' }
          Split-Path -Parent $resourceCompiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev libssl-dev \
            libvulkan-dev libclang-dev
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
      - run: cargo build --release --locked -p djcraft
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem ${env:ProgramFiles(x86)},$env:ProgramFiles -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler was not found' }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\target\release" packaging\windows\fadercraft.iss
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item packaging\windows\output\*.exe dist\
          Get-FileHash dist\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist\SHA256SUMS-windows.txt
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          arch=$(uname -m)
          mkdir -p dist/faderCraft.app/Contents/MacOS
          cp target/release/djcraft dist/faderCraft.app/Contents/MacOS/faderCraft
          cat > dist/faderCraft.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>faderCraft</string>
          <key>CFBundleIdentifier</key><string>com.dwell2012.fadercraft</string>
          <key>CFBundleName</key><string>faderCraft</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${version}</string>
          </dict></plist>
          EOF
          hdiutil create -volname faderCraft -srcfolder dist/faderCraft.app -ov -format UDZO "dist/faderCraft-${version}-macos-${arch}.dmg"
          rm -rf dist/faderCraft.app
          (cd dist && shasum -a 256 *.dmg > "SHA256SUMS-macos-${arch}.txt")
      - name: Package Linux archive and Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          arch=$(dpkg --print-architecture)
          archive_arch=$(uname -m)
          mkdir -p dist/package
          cp target/release/djcraft dist/package/fadercraft
          cp LICENSE dist/package/LICENSE
          tar -C dist/package -czf "dist/faderCraft-${version}-linux-${archive_arch}.tar.gz" .
          rm -rf dist/package
          mkdir -p dist/deb/DEBIAN dist/deb/usr/bin dist/deb/usr/share/applications dist/deb/usr/share/doc/fadercraft
          install -m 755 target/release/djcraft dist/deb/usr/bin/fadercraft
          install -m 644 LICENSE dist/deb/usr/share/doc/fadercraft/copyright
          printf 'Package: fadercraft\nVersion: %s\nSection: sound\nPriority: optional\nArchitecture: %s\nMaintainer: faderCraft <noreply@github.com>\nDescription: Open-source DJ application\n' "$version" "$arch" > dist/deb/DEBIAN/control
          printf '[Desktop Entry]\nType=Application\nName=faderCraft\nExec=fadercraft\nCategories=Audio;AudioVideo;\nTerminal=false\n' > dist/deb/usr/share/applications/fadercraft.desktop
          dpkg-deb --build --root-owner-group dist/deb "dist/faderCraft-${version}-linux-${arch}.deb"
          rm -rf dist/deb
          (cd dist && sha256sum *.tar.gz *.deb > "SHA256SUMS-linux-${arch}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: fadercraft-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' && vars.ASIO_DISTRIBUTION_APPROVED == 'true'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fadercraft-*
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
